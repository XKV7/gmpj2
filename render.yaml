# Render 블루프린트 (무료 플랜) — Render 대시보드에서 "New → Blueprint"로 이 저장소를 연결하면 그대로 배포된다.
# 무료 플랜은 디스크가 없어서 서버가 잠들거나 재배포되면 파일이 초기화된다.
# FIREBASE_SERVICE_ACCOUNT를 넣으면 계정·대화·업로드를 Firebase Firestore에 백업했다가 시작할 때 복원한다.
services:
  - type: web
    name: moyeo
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # 1이면 서버가 (빈 DB로) 시작할 때마다 체험용 계정 5개와 대화 기록을 만든다
      - key: MOYEO_DEMO
        value: "0"
      # Firebase 서비스 계정 키(JSON 파일 내용 전체). 대시보드에서 직접 붙여넣는다 (README 참고)
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
